# Actions are pinned to commit SHAs (see the version comment on each `uses:`).
# Dependabot moves the SHA and the comment together, once a release is a week
# old, so a hijacked tag has time to be noticed before it is proposed here.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"
