name: Deploy Pipeline Portal

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-2

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Must be id., not auth. Keycloak runs with KC_HOSTNAME=id.oasysic.net
          # and rewrites every frontend URL to that host, so a login started on
          # auth. sets its cookies there and then posts the form to id., which
          # never receives them -> "cookie_not_found" -> the generic Keycloak
          # error page, after the password is entered. This also matches the
          # token issuer (https://id.oasysic.net/realms/oil).
          VITE_KEYCLOAK_URL: https://id.oasysic.net
          VITE_KEYCLOAK_REALM: oil
          VITE_KEYCLOAK_CLIENT_ID: pipeline-portal
          #
          # VITE_GITHUB_TOKEN is deliberately NOT set. Vite inlines every VITE_*
          # variable into the client bundle, so passing a PAT here published it
          # to anyone who fetched /assets/index-*.js. The token that was here is
          # compromised and must be revoked.
          #
          # Nothing breaks: isGitHubApiEnabled() already returns false without a
          # token, so the portal falls back to its S3 data feed, which is the
          # intended architecture. The GitHub path only ever served in-progress
          # runs and runs missing from S3.

      # A secret must never reach the client bundle again. Vite inlines VITE_*
      # by design, so the guard belongs at build time, not in review.
      - name: Fail if a credential reached the bundle
        run: |
          if grep -rEq 'github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}' dist/; then
            echo "::error::A credential is present in the built bundle. Anything named VITE_* is inlined into client-side JavaScript and served publicly. Do not pass secrets to the build."
            exit 1
          fi
          echo "No credential patterns found in dist/."

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy to S3
    runs-on: ubuntu-latest
    needs: build
    environment: production
    
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: arn:aws:iam::432780980329:role/oil-pipeline-portal-deploy-dev
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync dist/ s3://oil-pipeline-portal-dev-432780980329 \
            --delete \
            --cache-control "public, max-age=31536000" \
            --exclude "index.html" \
            --exclude "*.json"
          
          # Upload index.html and JSON files with no-cache
          aws s3 cp dist/index.html s3://oil-pipeline-portal-dev-432780980329/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id EMR8NJRFQ0WQ4 \
            --paths "/*"

      - name: Output URL
        run: |
          echo "🚀 Deployed to https://pipelines.dev.oasysic.net"
